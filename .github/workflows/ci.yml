name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: game

jobs:
  test-and-build:
    name: Typecheck, unit tests, web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:strict-index
      - run: npm run lint
      - run: npm run lint:i18n
      # docs/GAP-AUDIT.md summary counts are generated from the per-row tables (WP-S): regeneration may not change the file.
      - run: npm run audit:counts
      - run: git diff --exit-code -- ../docs/GAP-AUDIT.md
      # THIRD_PARTY_LICENSES.md must match package-lock (2.12#28); audio files must be listed in assets/LICENSES.csv (unit test).
      - run: npm run licenses:check
      - run: npm run build
      # Size budgets (scripts/budgets.json): fails on bundle bloat or stray audio files.
      - run: npm run budgets
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: game/dist

  unit:
    name: Unit tests (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      # A full run takes hours on one runner; eight shards run in parallel. Blob reports carry coverage to the merge job.
      - run: npx vitest run --shard=${{ matrix.shard }}/8 --reporter=blob --coverage
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-${{ matrix.shard }}
          path: game/.vitest/blob
          include-hidden-files: true
          if-no-files-found: ignore

  coverage:
    name: Unit tests + coverage (merged)
    runs-on: ubuntu-latest
    needs: unit
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-*
          path: game/.vitest/blob
          merge-multiple: true
      # Fails if any shard failed; coverage thresholds for src/sim/** live in vite.config.ts (blocking).
      - run: npx vitest run --merge-reports --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: game/coverage
          if-no-files-found: ignore

  e2e:
    name: Playwright e2e (Chromium)
    runs-on: ubuntu-latest
    needs: [test-and-build, coverage]
    # Blocking: a red e2e run fails the workflow.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: game/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: game/dist
      - run: npm ci
      # No Google Chrome channel on the runner: playwright.config.ts falls back to bundled Chromium when CI is set.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: 'true'
          E2E_SHOTS: test-results/shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: game/test-results
          if-no-files-found: ignore

  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    needs: [test-and-build, coverage]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: game/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run cap:sync
      - name: assembleDebug
        working-directory: game/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: starpath-android-debug-apk
          path: game/android/app/build/outputs/apk/debug/*.apk
