<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1410" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Kickborn — Audio Lab</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; background: #0b1410; color: #e8f0ea; font: 14px/1.4 system-ui, 'Segoe UI', Roboto, Arial, sans-serif; }
      main { max-width: 1100px; margin: 0 auto; padding: 16px; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #8fb39d; margin: 18px 0 8px; }
      p.note { color: #9ab; margin: 0 0 12px; font-size: 12px; }
      section { background: #0f1a14; border: 1px solid #1f3328; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      button { background: #18271f; color: #e8f0ea; border: 1px solid #2c4a39; border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
      button:hover { border-color: #ffd23f; }
      button.on { background: #ffd23f; color: #111; border-color: #ffd23f; font-weight: 700; }
      label { display: inline-flex; gap: 6px; align-items: center; color: #cde; font-size: 12px; }
      input[type=range] { width: 120px; }
      #state { font: 12px ui-monospace, monospace; color: #ffd23f; white-space: pre-wrap; overflow-wrap: anywhere; }
      #stats { font: 12px ui-monospace, monospace; color: #bfe; white-space: pre-wrap; overflow-wrap: anywhere; }
      html, body { overflow-x: hidden; }
    </style>
  </head>
  <body>
    <main>
      <h1>Audio Lab</h1>
      <p class="note">Dev-only. Every sound here is synthesised in code (WebAudio); there are no audio files. Click anywhere to unlock audio.</p>
      <div id="lab"></div>
      <section><h2>Engine</h2><div id="state"></div><div id="stats"></div></section>
    </main>
    <script type="module" src="/src/audio/lab/main.ts"></script>
  </body>
</html>
