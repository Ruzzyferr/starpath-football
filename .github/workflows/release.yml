name: Release builds

# Desktop installers for every OS + Android debug APK, on version tags (v0.2.0 …)
# or manually. Tag builds are attached to a draft GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: game

jobs:
  desktop:
    name: Electron (${{ matrix.os }})
    # Protected environment: configure required reviewers + the signing secrets on it (Settings > Environments > release).
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: electron-builder
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # Unsigned unless signing secrets are configured (see docs/PLATFORM.md).
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Signature verification (2.9#98/#99): only meaningful (and enforced) when signing secrets exist.
      - name: Verify Windows signature
        if: matrix.os == 'windows-latest' && env.CSC_LINK != ''
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            if ($sig.Status -ne 'Valid') { throw "Bad signature on $($_.Name): $($sig.Status)" }
          }
      - name: Verify macOS signature and notarization
        if: matrix.os == 'macos-latest' && env.CSC_LINK != ''
        run: |
          APP=$(ls -d release/mac*/*.app | head -n1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose "$APP"
          xcrun stapler validate "$APP" || echo "::warning::not stapled (notarization not configured)"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            game/release/*.exe
            game/release/*.dmg
            game/release/*.AppImage
          if-no-files-found: error

  android:
    name: Android debug APK
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: game/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run cap:sync
      - name: assembleDebug
        working-directory: game/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: game/android/app/build/outputs/apk/debug/*.apk

  steam-depot:
    name: Steam depot layout
    needs: [desktop]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: depots
      # Lays the installers out as steam/content/<os> and renders steam/app_build.vdf. The upload itself
      # (steamcmd +run_app_build) needs a Steam partner account, app id and a build-account login:
      # BLOCKED-EXTERNAL, see docs/PLATFORM.md.
      - name: Assemble depot folders
        run: node game/scripts/steam-depot.mjs depots steam-out
        env:
          SP_STEAM_APP_ID: ${{ vars.STEAM_APP_ID }}
          SP_STEAM_BRANCH: ${{ vars.STEAM_BRANCH }}
      - uses: actions/upload-artifact@v4
        with:
          name: steam-depot
          path: steam-out
          if-no-files-found: error

  publish:
    name: Draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '{desktop-*,android-*}'
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/**/*
