# electron-builder config — `npm run desktop:build` builds for the current OS.
appId: app.starpath.football
productName: Kickborn
copyright: Copyright © 2026 Kickborn
directories:
  output: release
  buildResources: build-resources
# The renderer is fully bundled by Vite: ship only dist/ + the Electron shell, no node_modules.
files:
  - dist/**/*
  - electron/**/*
  - build-resources/icon.png
  - package.json
  - "!node_modules/**/*"
  - "!dist/sw.js"
# steamworks.js (optional, Steam builds) ships native .node binaries that must live outside the asar.
asarUnpack:
  - "**/*.node"
artifactName: Kickborn-${version}-${os}-${arch}.${ext}
# Electron Fuses (2.9#86): flipped at package time. The shell never needs Node-as-runtime, NODE_OPTIONS or --inspect.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
win:
  icon: build-resources/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Kickborn
  artifactName: Kickborn-Setup-${version}-${arch}.${ext}
portable:
  artifactName: Kickborn-Portable-${version}-${arch}.${ext}
mac:
  icon: build-resources/icon.png
  category: public.app-category.sports-games
  target:
    - target: dmg
      arch: [universal]
  hardenedRuntime: true
dmg:
  artifactName: Kickborn-${version}-mac.${ext}
linux:
  icon: build-resources/icon.png
  category: Game
  target:
    - target: AppImage
      arch: [x64]
  synopsis: Futbol kariyeri ve yaşam simülasyonu
publish: null
