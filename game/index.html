<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!-- No browser zoom (double-tap / pinch / input focus): the app scales its own text (Settings > text size, 90-200%). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#070b14" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="StarPath Football — futbol kariyeri ve yaşam simülasyonu." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="./icons/icon-48.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="StarPath" />
    <title>StarPath Football</title>
    <style>
      html, body { background: #070b14; touch-action: manipulation; }
    </style>
    <!-- Boot guard (ES5, runs on any WebView): shows a readable error instead of a black screen when the
         bundle cannot load or throws before the first render. See public/boot-guard.js. -->
    <script src="./boot-guard.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>StarPath Football requires JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
