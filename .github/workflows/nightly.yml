name: Nightly soak

# 10,000 simulated career seasons (1,000 careers x 10 seasons) with the economy guard-rails from
# src/sim/game/balance.test.ts (<= 5% bankruptcies, only reckless personas may go under), plus the
# full unit suite and the size budgets (GAP-AUDIT 2.12#86). The balance tables, a 100-season world
# ability report (mean / p95 / p99 / max) and the drift guard are uploaded as artifacts and summarised on the run page (2.5#125).
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

defaults:
  run:
    working-directory: game

jobs:
  balance-10k:
    name: 10,000 season balance soak
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - name: Balance report (1000 careers x 10 seasons)
        run: npx vitest run src/sim/game/balance.test.ts --reporter=verbose | tee balance-report.txt
        env:
          BALANCE: '1'
          BALANCE_N: '1000'
          BALANCE_SEASONS: '10'
      - name: World ability report (2 seeds x 100 seasons; mean, p95, p99, max)
        if: always()
        run: npx vitest run src/sim/world/worldReport.test.ts
        env:
          WORLD_REPORT: '1'
          WORLD_REPORT_OUT: world-report.md
      - name: Long-run world stability (100 seasons; mean and top end within limits)
        run: npx vitest run src/sim/world/longRun.test.ts
        env:
          LONGRUN: '1'
      - name: Balance summary on the run page
        if: always()
        run: |
          {
            echo '# Nightly balance report'
            echo
            sed -n '/^| Alan\|^| Ölçüt\|^### \|^| /p' balance-report.txt | grep -v '^| [0-9]* | \(pro\|spender\|gambler\|party\) ' | head -150 || true
            echo
            cat world-report.md 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balance-report
          path: |
            game/balance-report.txt
            game/world-report.md
          if-no-files-found: ignore
      - name: Stats drift guard (fails beyond src/sim/game/statsGuard.ts tolerances)
        run: npx vitest run src/sim/game/statsGuard.test.ts --reporter=verbose | tee stats-guard.txt
        env:
          STATS_GUARD: '1'
          STATS_GUARD_N: '200'
          STATS_GUARD_SEASONS: '10'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stats-guard
          path: game/stats-guard.txt
          if-no-files-found: ignore
      - run: npm test
      - run: npm run build
      - run: npm run budgets
